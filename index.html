<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>TDtimer</title>
<!-- 只引入这一个公式文件 -->
<script src="formulas.js"></script>
<!-- 引入 3D 渲染引擎 -->
<script type="module" src="https://cdn.cubing.net/v0/js/cubing/twisty"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff;color:#111;padding:12px;max-width:95vw;margin:0 auto;touch-action:manipulation}
h1{text-align:center;margin:12px 0;font-size:24px}
.puzzleDropdownWrap{position:relative;width:fit-content;margin:0 auto 12px}
#puzzleMainBtn{padding:9px 16px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:15px;cursor:pointer;min-width:120px}
#puzzleDropdownList{position:absolute;top:105%;left:0;width:max-content;min-width:120px;max-width:90vw;border:1px solid #ddd;background:#fff;border-radius:0 0 8px 8px;box-shadow:0 4px 12px #00000022;display:none;z-index:99;max-height:320px;overflow-y:auto}
#puzzleDropdownList.show{display:block}
.puzzleOption{padding:8px 14px;cursor:pointer;outline:none}
.puzzleOption:hover,.puzzleOption:focus{background:#f3f3f3}
.puzzleOption.active{background:#333;color:#fff}
.tab{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab button{flex:1;padding:10px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:15px;cursor:pointer}
.tab button.active{background:#333;color:#fff;border-color:#333}
.moduleTab{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.moduleTab button{flex:1;padding:12px;border:1px solid #333;background:#fff;color:#333;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;min-width:100px;}
.moduleTab button.active{background:#333;color:#fff;}
.subTab{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap;}
.subTab button{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;flex:1;min-width:60px;}
.subTab button.active{background:#444;color:#fff;}
#timerWrap{text-align:center;margin:20px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#timeDisplay{font-size:clamp(48px,15vw,72px);max-width:90vw;margin:10px auto;font-weight:bold;font-variant-numeric:tabular-nums}
#timeDisplay.ready{color:#ffbb00}
#timeDisplay.go{color:#22aa22}
#timeDisplay.observe{color:#dd2222}
.scrambleRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.scramble{font-size:18px;font-weight:500;word-break:break-all;min-height:24px;text-align:center}
#newScrambleBtn{padding:6px 10px;cursor:pointer}
#scrambleViewer{width:max(min(80vw,300px),200px);height:max(min(80vw,300px),200px);margin:10px auto;overflow:hidden}
twisty-player{width:100%;height:100%}
.formulaItem{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.twistContainer{margin-top:8px;height:200px}
#historyBox{margin-top:20px;border:1px solid #ddd;padding:12px;border-radius:8px}
.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#clearRecordsBtn{padding:4px 10px;border:1px solid #c82423;color:#c82423;background:#fff;border-radius:6px;font-size:13px;cursor:pointer}
.history-item{padding:8px 4px;cursor:pointer;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px}
.history-item.selected{background:#f0f7ff}
.history-time{font-variant-numeric:tabular-nums;font-size:16px}
.history-time .penalty{font-weight:bold;margin-left:4px}
.history-time .penalty.p2{color:#e08a00}
.history-time .penalty.dnf{color:#c82423}
.history-item .raw-time{color:#888;font-size:13px;margin-left:6px}
.penalty-panel{margin-top:8px;padding:8px;background:#f8f8f8;border-radius:6px;word-break:break-all}
.penalty-btn,.del-btn{margin:3px;padding:6px 12px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
.del-btn{border-color:#ff6666;background:#fff2f2;color:#c82423}
#statPanel{margin:12px 0;padding:10px;border:1px solid #ccc;border-radius:8px;text-align:center;line-height:1.6}
#observeToggle{margin-bottom:8px;padding:6px 10px;cursor:pointer}
.warn-text{color:#c82423;font-size:14px;margin-top:4px;text-align:center}
.trainerPanel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:#f9f9f9;border-radius:8px;border:1px dashed #ccc;}
.trainerPanel button{padding:8px 16px;font-size:14px;font-weight:bold;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;transition:all 0.2s;}
.trainerPanel button:hover{background:#e0e0e0;}
.trainerPanel button.active{background:#333;color:#fff;border-color:#333;}
.trainerPanel button.stop-btn{border-color:#c82423;color:#c82423;display:none;}
@media (max-width: 360px) {
  .tab button { padding: 6px; font-size: 13px; }
  #puzzleMainBtn { padding: 6px 10px; font-size: 13px; }
  .penalty-btn, .del-btn { padding: 4px 8px; font-size: 12px; }
}
</style>
</head>
<body>
<header>
    <h1>TDtimer</h1>
    <div class="puzzleDropdownWrap">
        <button type="button" id="puzzleMainBtn" aria-haspopup="menu" aria-expanded="false">三阶</button>
        <div id="puzzleDropdownList" role="menu">
            <div class="puzzleOption active" role="menuitem" tabindex="0">三阶</div>
            <div class="puzzleOption" role="menuitem" tabindex="0">二阶</div>
            <div class="puzzleOption" role="menuitem" tabindex="0">四阶</div>
            <div class="puzzleOption" role="menuitem" tabindex="0">金字塔</div>
            <div class="puzzleOption" role="menuitem" tabindex="0">斜转</div>
        </div>
    </div>
    <nav class="tab" role="navigation">
        <button type="button" data-tab="timer" class="active" aria-controls="timer">计时</button>
        <button type="button" data-tab="formula" aria-controls="formula">公式库</button>
        <button type="button" data-tab="bluetooth" aria-controls="bluetooth">蓝牙</button>
    </nav>
</header>

<main>
    <section id="timer" class="page">
        <button type="button" id="observeToggle">开启 WCA 15s观察</button>
        <div class="scrambleRow">
            <div>
                <div id="scrambleText" class="scramble">加载中...</div>
                <div id="warnMsg" class="warn-text"></div>
            </div>
            <button type="button" id="newScrambleBtn">新打乱</button>
        </div>
        <div id="scrambleViewer"></div>
        <div id="statPanel">
            <div>MO3：<span id="mo3">—</span> | AO5：<span id="ao5">—</span> | AO12：<span id="ao12">—</span></div>
            <div>最佳：<span id="bestSingle">—</span> | 最佳AO5：<span id="bestAo5">—</span></div>
        </div>
        <div id="timerWrap">
            <div id="timeDisplay">0.00</div>
            <p id="tipText">单击观察 / 长按预备</p>
        </div>
        <div id="historyBox">
            <div class="history-head"><h3>成绩记录</h3><button type="button" id="clearRecordsBtn">清空记录</button></div>
            <div id="historyList"></div>
        </div>
    </section>

    <section id="formula" class="page" style="display:none">
        <div class="trainerPanel">
            <button type="button" id="btnTrainOLL">🎯 训练三阶OLL</button>
            <button type="button" id="btnTrainPLL">🎯 训练三阶PLL</button>
            <button type="button" id="btnTrain2x2">🎯 训练二阶</button>
            <button type="button" id="btnStopTrain" class="stop-btn">🛑 停止训练</button>
        </div>
        <div id="dynamicFormulaUI"></div>
    </section>

    <section id="bluetooth" class="page" style="display:none"><h3>蓝牙待开发</h3></section>
</main>

<script>
window.onerror = function(msg) { console.log("防崩捕获:", msg); return true; };

const pList = [{key:"3x3x3",name:"三阶",eventId:"333"},{key:"2x2x2",name:"二阶",eventId:"222"},{key:"4x4x4",name:"四阶",eventId:"444"},{key:"pyraminx",name:"金字塔",eventId:"pyraminx"},{key:"skewb",name:"斜转",eventId:"skewb"}];
const fData = {"333":["R U R' U R U2 R'","F R U R' U' F'"],"default":["R U R' U'"]};
let curP = pList[0], curScr = "", isDrop = false, isFail = false;
let trainMode = null, currentTrainCase = "";

const mBtn = document.getElementById("puzzleMainBtn"), dList = document.getElementById("puzzleDropdownList"), sText = document.getElementById("scrambleText"), sCubeWrap = document.getElementById("scrambleViewer"), wMsg = document.getElementById("warnMsg");
let sCube = null;

function checkWebGL() { try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); } catch(e) { return false; } }

setTimeout(() => {
    try {
        const s2 = document.createElement("script"); s2.type = "module"; s2.textContent = `import {Alg} from "https://cdn.cubing.net/v0/js/cubing/alg"; import {randomScrambleForEvent} from "https://cdn.cubing.net/v0/js/cubing/scramble"; window.Alg=Alg; window.randomScrambleForEvent=randomScrambleForEvent; window.dispatchEvent(new Event('libReady'));`; document.head.appendChild(s2);
    } catch(e) { isFail = true; }
}, 100);
window.addEventListener('libReady', () => { isFail = false; genScr(); });

const safeLS = { get: k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } }, set: (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e) {} }, remove: k => { try { localStorage.removeItem(k); } catch(e) {} } };
function getRandomAUF() { let aufs = ["", "U ", "U' ", "U2 "]; return aufs[Math.floor(Math.random() * aufs.length)]; }

async function genScr() {
    if (trainMode) {
        let pool = window.FormulaDB ? window.FormulaDB[trainMode[0]][trainMode[1]] : null;
        let cubeType = trainMode[0] === '2x2' ? "2x2x2" : "3x3x3";
        if (!pool) return;
        
        let item = pool[Math.floor(Math.random() * pool.length)];
        currentTrainCase = item[0];
        let alg = item[1];
        let setupStr = "";
        try { setupStr = new window.Alg(alg).invert().toString(); } catch(e) { setupStr = alg; }
        
        let aufPre = (trainMode[0] === '3x3') ? getRandomAUF() : "";
        let aufPost = (trainMode[0] === '3x3') ? getRandomAUF() : "";
        let fullSetup = (aufPre + setupStr + " " + aufPost).trim();

        curScr = fullSetup;
        sText.textContent = `[${currentTrainCase}] 打乱: ${fullSetup}`;
        wMsg.textContent = "提示: 做原公式即可复原";
        
        if (!sCube && checkWebGL() && typeof customElements !== 'undefined' && customElements.get('twisty-player')) {
            try { sCube = document.createElement("twisty-player"); sCube.setAttribute("puzzle", cubeType); sCube.setAttribute("background","none"); sCube.setAttribute("control-panel","none"); sCubeWrap.appendChild(sCube); } catch(e) { sCube = null; }
        }
        if (sCube) { sCube.setAttribute("puzzle", cubeType); sCube.setAttribute("alg", fullSetup); }
        return;
    }

    sText.textContent = "生成中..."; wMsg.textContent = "";
    let k = curP.puzzle || curP.key, fb = fData[curP.eventId] || fData.default;
    if (!sCube && checkWebGL() && typeof customElements !== 'undefined' && customElements.get('twisty-player')) {
        try { sCube = document.createElement("twisty-player"); sCube.setAttribute("puzzle","3x3x3"); sCube.setAttribute("background","none"); sCube.setAttribute("control-panel","none"); sCubeWrap.appendChild(sCube); } catch(e) { sCube = null; }
    }
    if (isFail || !window.randomScrambleForEvent) { setS(fb[Math.floor(Math.random()*fb.length)], true); if (sCube) sCube.setAttribute("puzzle",k); return; }
    try { let a = await window.randomScrambleForEvent(curP.eventId); setS(a.toString(), false); if (sCube) sCube.setAttribute("puzzle",k); } 
    catch(e) { setS(fb[Math.floor(Math.random()*fb.length)], true); if (sCube) sCube.setAttribute("puzzle",k); }
}
function setS(str, fb) { curScr = str; sText.textContent = str; if (sCube) sCube.setAttribute("alg",str); wMsg.textContent = fb ? "⚠️ 降级：本地打乱" : ""; }

const btnTrainOLL = document.getElementById("btnTrainOLL"), btnTrainPLL = document.getElementById("btnTrainPLL"), btnTrain2x2 = document.getElementById("btnTrain2x2"), btnStopTrain = document.getElementById("btnStopTrain");
function startTrain(p, c) {
    trainMode = [p, c];
    btnTrainOLL.classList.toggle("active", p==='3x3' && c==='OLL');
    btnTrainPLL.classList.toggle("active", p==='3x3' && c==='PLL');
    btnTrain2x2.classList.toggle("active", p==='2x2');
    btnStopTrain.style.display = "inline-block";
    document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active")); 
    document.querySelector('[data-tab="timer"]').classList.add("active");
    document.querySelectorAll(".page").forEach(p=>p.style.display="none"); 
    document.getElementById("timer").style.display="block";
    genScr();
}
btnTrainOLL.onclick = () => startTrain('3x3', 'OLL');
btnTrainPLL.onclick = () => startTrain('3x3', 'PLL');
btnTrain2x2.onclick = () => startTrain('2x2', 'OLL');
btnStopTrain.onclick = () => {
    trainMode = null; currentTrainCase = "";
    btnTrainOLL.classList.remove("active"); btnTrainPLL.classList.remove("active"); btnTrain2x2.classList.remove("active");
    btnStopTrain.style.display = "none";
    if (sCube) sCube.setAttribute("puzzle", curP.puzzle || curP.key);
    genScr();
};

const optNodes = document.querySelectorAll('.puzzleOption');
optNodes.forEach((opt, i) => {
    const p = pList[i];
    opt.onclick = async () => {
        curP = p; isDrop = false; dList.classList.remove("show"); mBtn.setAttribute("aria-expanded", "false"); mBtn.textContent = curP.name; optNodes.forEach((o, j) => o.classList.toggle("active", i === j));
        if (trainMode) btnStopTrain.click(); 
        else { await genScr(); renderHist(); }
    };
});
mBtn.onclick = e => { e.stopPropagation(); isDrop = !isDrop; dList.classList.toggle("show", isDrop); };
document.addEventListener("click", () => { if (isDrop) { isDrop = false; dList.classList.remove("show"); } });
document.getElementById("newScrambleBtn").onclick = () => genScr();

let tState = "idle", stT = 0, raf = null, rTimer = null, oTimer = null, oStT = 0, oOn = false, isOver = false, pStT = 0, wasIdle = false;
const tDom = document.getElementById("timeDisplay"), tWrap = document.getElementById("timerWrap"), tTip = document.getElementById("tipText");
document.getElementById("observeToggle").onclick = e => { oOn = !oOn; e.target.textContent = oOn ? "✅ 已开启15s" : "开启 15s观察"; };
function clrT() { if(raf){cancelAnimationFrame(raf);raf=null;} if(rTimer){clearTimeout(rTimer);rTimer=null;} if(oTimer){clearInterval(oTimer);oTimer=null;} }
function reset() { clrT(); tState = "idle"; isOver = false; tDom.className = ""; tDom.textContent = "0.00"; tTip.textContent = "单击观察 / 长按预备"; }
function startT() { clrT(); stT = Date.now(); tState = "running"; tDom.className = ""; tTip.textContent = "计时中"; const lp = () => { if(tState!=="running")return; tDom.textContent = ((Date.now()-stT)/1000).toFixed(2); raf = requestAnimationFrame(lp); }; lp(); }
function stopT() { if (tState === "running") { saveRec(Date.now()-stT, curScr, isOver ? "+2" : ""); tState = "idle"; isOver = false; clrT(); tDom.className = ""; tTip.textContent = "单击观察 / 长按预备"; genScr(); } else reset(); }
function startO() { clrT(); tState = "observe"; oStT = Date.now(); isOver = false; tDom.className = "observe"; tDom.textContent = "15"; tTip.textContent = "观察中"; oTimer = setInterval(() => { let el = Date.now()-oStT; if(el>=17000){ saveRec(0,curScr,"DNF"); reset(); return; } if(el>=15000){ isOver=true; tDom.textContent="0"; tTip.textContent="超15s +2"; } else tDom.textContent = Math.ceil((15000-el)/1000).toString(); }, 100); }
function bPress() { clrT(); if(tState==="running"){ stopT(); return; } if(tState==="idle"||tState==="observe"){ pStT=Date.now(); tState="readyCount"; tDom.className="ready"; if(wasIdle) tDom.textContent="0.00"; rTimer=setTimeout(()=>{ if(tState==="readyCount"){ tState="ready"; tDom.className="go"; } },800); } }
function ePress() { let h=Date.now()-pStT; clearTimeout(rTimer); if(tState==="ready") startT(); else if(tState==="readyCount"){ if (h<800 && wasIdle && oOn) { reset(); startO(); } else { tState = "idle"; tDom.className = ""; tTip.textContent = "单击观察 / 长按预备"; } } }

tWrap.addEventListener("touchstart", e => { e.preventDefault(); wasIdle = (tState === "idle"); bPress(); }, { passive: false });
tWrap.addEventListener("touchend", e => { e.preventDefault(); if (tState !== "running") ePress(); }, { passive: false });
tWrap.addEventListener("mousedown", e => { if (e.button !== 0) return; e.preventDefault(); wasIdle = (tState === "idle"); bPress(); });
tWrap.addEventListener("mouseup", e => { if (e.button !== 0) return; e.preventDefault(); if (tState !== "running") ePress(); });
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); if (e.repeat) return; wasIdle = (tState === "idle"); bPress(); } });
document.addEventListener("keyup", e => { if (e.code === "Space") { e.preventDefault(); if (tState !== "running") ePress(); } });

let sIdx = null; 
const gKey = () => "td_records_" + (trainMode ? trainMode.join('_') : curP.key); 
function saveRec(t,s,p){ let r=safeLS.get(gKey()); r.unshift({time:t,scramble:s,penalty:p,date:new Date().toLocaleString()}); safeLS.set(gKey(),r); renderHist(); }
function setPen(i,p){ let r=safeLS.get(gKey()); if(r[i]){ r[i].penalty=p; safeLS.set(gKey(),r); renderHist(); } }
function delRec(i){ let r=safeLS.get(gKey()); r.splice(i,1); sIdx=null; safeLS.set(gKey(),r); renderHist(); }
function calcA(recs,n){ if(recs.length<n)return null; let v=recs.slice(0,n).map(r=>r.penalty==="DNF"?null:r.time+(r.penalty==="+2"?2000:0)); if(v.includes(null))return null; v.sort((a,b)=>a-b); return v.slice(1,-1).reduce((a,b)=>a+b,0)/(n-2); }

function renderHist() {
    let r = safeLS.get(gKey()), box = document.getElementById("historyList"); while (box.firstChild) box.removeChild(box.firstChild);
    let bst = r.length ? Math.min(...r.filter(x=>x.penalty!=="DNF").map(x=>x.time+(x.penalty==="+2"?2000:0))) : null;
    ["mo3","ao5","ao12"].forEach((id,i)=>{ let v=calcA(r,i*2+3); document.getElementById(id).textContent = v ? (v/1000).toFixed(2) : "—"; });
    document.getElementById("bestSingle").textContent = isFinite(bst) ? (bst/1000).toFixed(2) : "—";
    
    r.forEach((x,i)=>{
        let d = document.createElement("div"); d.className = "history-item" + (sIdx===i ? " selected" : "");
        let ts = document.createElement("span"); ts.className = "history-time";
        let st = x.penalty==="DNF" ? "DNF" : ((x.time+(x.penalty==="+2"?2000:0))/1000).toFixed(2);
        ts.textContent = st;
        if(x.penalty) {
            let ps = document.createElement("span"); ps.className = "penalty " + (x.penalty==='+2'?'p2':'dnf'); ps.textContent = x.penalty; ts.appendChild(ps);
            let rs = document.createElement("span"); rs.className = "raw-time"; rs.textContent = `(${(x.time/1000).toFixed(2)})`; ts.appendChild(rs);
        }
        let ds = document.createElement("span"); ds.style.color = "#888"; ds.style.fontSize = "13px"; ds.textContent = x.date;
        d.appendChild(ts); d.appendChild(ds);
        d.onclick = () => { sIdx = sIdx===i ? null : i; renderHist(); };
        box.appendChild(d);
        
        if(sIdx === i) {
            let p = document.createElement("div"); p.className = "penalty-panel";
            let sd = document.createElement("div"); sd.textContent = "打乱：" + x.scramble;
            let bd = document.createElement("div"); bd.style.marginTop = "6px";
            [["p2","+2"],["dnf","DNF"],["clear","清除"]].forEach(([act, txt]) => {
                let btn = document.createElement("button"); btn.type = "button"; btn.className = "penalty-btn"; btn.dataset.act = act; btn.dataset.idx = i; btn.textContent = txt; bd.appendChild(btn);
            });
            let db = document.createElement("button"); db.type = "button"; db.className = "del-btn"; db.dataset.act = "del"; db.dataset.idx = i; db.textContent = "删除"; bd.appendChild(db);
            p.appendChild(sd); p.appendChild(bd); box.appendChild(p);
        }
    });
}
document.getElementById("historyList").onclick = e => { let b=e.target.closest("button[data-act]"); if(!b)return; let i=parseInt(b.dataset.idx), a=b.dataset.act; if(a==="p2")setPen(i,"+2"); else if(a==="dnf")setPen(i,"DNF"); else if(a==="clear")setPen(i,""); else delRec(i); };
document.getElementById("clearRecordsBtn").onclick = () => { if(confirm("清空当前记录？")){ safeLS.remove(gKey()); sIdx=null; renderHist(); } };

document.querySelectorAll(".tab button").forEach(b => { b.onclick = () => { document.querySelectorAll(".tab button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); document.querySelectorAll(".page").forEach(p=>p.style.display="none"); document.getElementById(b.dataset.tab).style.display="block"; }; });

function buildFormulaUI() {
    const container = document.getElementById("dynamicFormulaUI");
    while (container.firstChild) container.removeChild(container.firstChild);

    if (!window.FormulaDB || Object.keys(window.FormulaDB).length === 0) {
        let err = document.createElement("div");
        err.style = "color:#c82423; padding:20px; text-align:center; font-weight:bold;";
        err.innerHTML = "⚠️ 外部数据未加载<br><br><button onclick='location.reload()' style='padding:10px 20px;font-size:16px;margin-top:10px;'>点击重试</button>";
        container.appendChild(err);
        return;
    }

    const moduleTab = document.createElement("div"); moduleTab.className = "moduleTab";
    const contentArea = document.createElement("div");
    const puzzleNames = { "3x3": "三阶公式库", "2x2": "二阶公式库", "lsll": "LSLL 公式库" };

    Object.keys(window.FormulaDB).forEach((puzzleKey, idx) => {
        let modBtn = document.createElement("button");
        modBtn.type = "button"; modBtn.textContent = puzzleNames[puzzleKey] || (puzzleKey + " 公式库");
        if(idx === 0) modBtn.classList.add("active");
        
        let puzzleData = window.FormulaDB[puzzleKey];
        let puzzleDiv = document.createElement("div");
        puzzleDiv.style.display = idx === 0 ? "block" : "none";
        
        let subTab = document.createElement("div"); subTab.className = "subTab";
        let subContentWrap = document.createElement("div");
        
        Object.keys(puzzleData).forEach((catKey, catIdx) => {
            let subBtn = document.createElement("button");
            subBtn.type = "button"; subBtn.textContent = catKey;
            if(catIdx === 0) subBtn.classList.add("active");
            
            let listDiv = document.createElement("div");
            listDiv.style.display = catIdx === 0 ? "block" : "none";
            
            renderFormulaList(puzzleData[catKey], listDiv, puzzleKey === "2x2" ? "2x2x2" : "3x3x3");
            
            subBtn.onclick = () => {
                Array.from(subTab.children).forEach(c => c.classList.remove("active"));
                subBtn.classList.add("active");
                Array.from(subContentWrap.children).forEach(c => c.style.display = "none");
                listDiv.style.display = "block";
            };
            subTab.appendChild(subBtn);
            subContentWrap.appendChild(listDiv);
        });
        
        puzzleDiv.appendChild(subTab);
        puzzleDiv.appendChild(subContentWrap);
        
        modBtn.onclick = () => {
            Array.from(moduleTab.children).forEach(c => c.classList.remove("active"));
            modBtn.classList.add("active");
            Array.from(contentArea.children).forEach(c => c.style.display = "none");
            puzzleDiv.style.display = "block";
        };
        
        moduleTab.appendChild(modBtn);
        contentArea.appendChild(puzzleDiv);
    });

    container.appendChild(moduleTab);
    container.appendChild(contentArea);
}

function renderFormulaList(raw, containerDiv, puzzleType) {
    raw.forEach(item => {
        let name = item[0], alg = item[1];
        let d = document.createElement("div"); d.className = "formulaItem"; d.dataset.open = "false";
        let b = document.createElement("b"); b.textContent = name; d.appendChild(b); d.appendChild(document.createTextNode("：" + alg));
        let tc = document.createElement("div"); tc.className = "twistContainer"; d.appendChild(tc);
        
        d.onclick = e => {
            if(e.target.tagName.toLowerCase()==="twisty-player") return; 
            let c = d.querySelector(".twistContainer");
            if(d.dataset.open === "true"){ while(c.firstChild) c.removeChild(c.firstChild); d.dataset.open = "false"; }
            else {
                document.querySelectorAll(".formulaItem").forEach(el => { let t = el.querySelector(".twistContainer"); if(t) while(t.firstChild) t.removeChild(t.firstChild); el.dataset.open = "false"; });
                
                // 【修复核心】：在点击的瞬间才计算逆公式，此时 3D 库 100% 已经加载完毕！
                let cleanAlg = alg.replace(/[xyz]\s*['2]?/gi, '').replace(/['’]2/g, '2').trim();
                let s = "";
                try { 
                    if(window.Alg) {
                        s = new window.Alg(cleanAlg).invert().toString(); 
                    } else {
                        s = cleanAlg; // 如果库真的挂了，至少不报错
                    }
                } catch(e) { 
                    s = cleanAlg; 
                }

                try { 
                    let tp = document.createElement("twisty-player"); 
                    tp.setAttribute("puzzle", puzzleType);
                    tp.setAttribute("experimental-setup-alg", s);
                    tp.setAttribute("experimental-setup-anchor", "end");
                    tp.setAttribute("alg", cleanAlg);
                    tp.setAttribute("control-panel","playback"); 
                    tp.setAttribute("autoplay","false"); 
                    c.appendChild(tp); 
                } catch(err) { c.textContent = "⚠️ 当前环境不支持3D渲染"; }
                d.dataset.open = "true";
            }
        };
        containerDiv.appendChild(d);
    });
}

window.addEventListener('load', () => {
    setTimeout(() => {
        buildFormulaUI();
        genScr(); renderHist();
    }, 100);
});
</script>
