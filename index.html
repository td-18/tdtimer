<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>TDtimer</title>
<script type="module" src="https://cdn.cubing.net/v0/js/cubing/twisty"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#ffffff;color:#111111;padding:12px;max-width:900px;margin:0 auto;touch-action:manipulation;}
h1{text-align:center;margin:12px 0;font-size:24px}
.tab{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab button{flex:1;padding:12px;border:none;background:#ddd;border-radius:8px;font-size:18px}
.tab button.active{background:#224;color:white}
#scramble{font-size:22px;margin:16px 0;line-height:1.6}
#timeDisplay{font-size:72px;text-align:center;margin:40px 0;font-weight:bold}
#timer{min-height:350px;}
.btn-group{margin-top:20px}
button{padding:8px 12px;border-radius:6px;border:1px solid #ccc;margin:4px;cursor:pointer}
</style>
</head>
<body>
<h1>TDtimer 魔方测速器</h1>
<div class="tab">
<button class="active" data-tab="timer">计时器</button>
<button data-tab="ollpll">OLL/PLL公式</button>
<button data-tab="stats">成绩统计</button>
</div>

<div id="timer" class="page">
<div id="scramble"></div>
<div id="timeDisplay">0.00</div>
<div class="btn-group">
<button id="newScramble">新打乱</button>
<button id="connectCube">连接智能魔方</button>
</div>
</div>

<div id="ollpll" class="page" style="display:none">
<h2>OLL / PLL</h2>
<p>公式库</p>
</div>

<div id="stats" class="page" style="display:none">
<h2>成绩统计</h2>
<div id="historyList"></div>
</div>

<script>
// ========== 计时核心变量 ==========
let isTiming = false;
let timerId = null;
let startTime = 0;
let elapsed = 0;
let scrambleText = "";
let records = JSON.parse(localStorage.getItem("tdtimer_history")) || [];
let holdStart = 0;
const HOLD_THRESHOLD = 200; //长按判定毫秒

// Tab切换
document.querySelectorAll(".tab button").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".tab button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".page").forEach(p=>p.style.display="none");
        const tabName = btn.getAttribute("data-tab");
        document.getElementById(tabName).style.display = "block";
    }
})

// 随机打乱生成
function generateScramble(){
    const moves = ["R","R'","R2","L","L'","L2","U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"];
    let s = [];
    for(let i=0;i<20;i++){
        s.push(moves[Math.floor(Math.random()*moves.length)]);
    }
    scrambleText = s.join(" ");
    document.getElementById("scramble").innerText = scrambleText;
}

// 更新时间显示
function renderTime(){
    if(isTiming){
        elapsed = Date.now() - startTime;
    }
    const sec = (elapsed / 1000).toFixed(2);
    document.getElementById("timeDisplay").innerText = sec;
}

// 开始计时
function startTimer(){
    if(isTiming) return;
    // 先清理残留定时器，防止叠加
    clearInterval(timerId);
    timerId = null;

    isTiming = true;
    startTime = Date.now();
    timerId = setInterval(renderTime, 20);
}

// 停止计时
function stopTimer(){
    if(!isTiming) return;
    clearInterval(timerId);
    timerId = null;
    isTiming = false;
    renderTime();
    // 保存成绩
    saveRecord(elapsed, scrambleText);
    // 自动生成下一条打乱
    generateScramble();
    resetTimerValue();
}

// 重置计时数值
function resetTimerValue(){
    elapsed = 0;
    renderTime();
}

// 保存记录
function saveRecord(timeMs, scramble){
    records.unshift({
        time: timeMs,
        scramble: scramble,
        date: new Date().toLocaleString()
    });
    localStorage.setItem("tdtimer_history", JSON.stringify(records));
    renderHistory();
}

// 渲染历史
function renderHistory(){
    const container = document.getElementById("historyList");
    container.innerHTML = "";
    records.forEach((r,idx)=>{
        const div = document.createElement("div");
        div.style.padding="8px;border-bottom:1px solid #eee";
        const t = (r.time/1000).toFixed(2);
        div.innerText = `${t} | ${r.scramble}`;
        container.appendChild(div);
    })
}

// 全屏触屏计时控制
const timerArea = document.getElementById("timer");

timerArea.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    if(isTiming){
        stopTimer();
        return;
    }
    holdStart = Date.now();
})

timerArea.addEventListener("pointerup", (e)=>{
    e.preventDefault();
    if(isTiming) return;
    const holdTime = Date.now() - holdStart;
    if(holdTime > HOLD_THRESHOLD){
        startTimer();
    }
})

// 新打乱按钮
document.getElementById("newScramble").onclick = ()=>{
    if(isTiming){
        stopTimer();
    }
    resetTimerValue();
    generateScramble();
}

// ========== 智能魔方蓝牙模块【多候选UUID】 ==========
// GAN魔方常见候选服务UUID列表
const GAN_UUID_LIST = [
    "0000fff0-0000-1000-8000-00805f9b34fb",
    "0000aadb-0000-1000-8000-00805f9b34fb"
];

document.getElementById("connectCube").onclick = async ()=>{
    try{
        alert("开始扫描蓝牙！\n⚠️ 手机系统蓝牙删除GAN魔方配对记录，转动魔方唤醒");
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices:true,
            optionalServices: GAN_UUID_LIST
        });
        console.log("选中设备：",device.name);
        const gatt = await device.gatt.connect();
        let foundService = null;
        // 逐个尝试UUID
        for(const suuid of GAN_UUID_LIST){
            try{
                foundService = await gatt.getPrimaryService(suuid);
                alert("✅ 成功！找到魔方服务 UUID:" + suuid);
                break;
            }catch(err){
                console.log("尝试UUID失败：",suuid, err);
            }
        }
        if(!foundService){
            alert("连接GATT成功，但是没有匹配的GAN服务UUID。\n需要使用nRF Connect抓包获取你的GAN16UI真实UUID");
        }
    }catch(err){
        alert("连接失败！\n1.转动魔方唤醒\n2.完全关闭魔方星球APP\n\n错误："+err.message);
    }
}

// 初始化
generateScramble();
renderHistory();
</script>
</body>
</html>
