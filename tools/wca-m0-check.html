<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WCA M0 check</title>
<style>
    body { font-family: ui-monospace, Consolas, monospace; padding: 20px; background: #0f172a; color: #d1fae5; }
    h1 { font-size: 18px; color: #f8fafc; }
    pre { white-space: pre-wrap; line-height: 1.6; }
    .fail { color: #fca5a5; }
    .pass { color: #86efac; }
</style>
</head>
<body>
<h1>WCA scramble M0 check</h1>
<pre id="out">running...</pre>

<script type="module">
import {
    PROTOCOL_VERSION,
    ScrambleService,
    getEvent,
    getScrambler,
    listOfficialEvents,
    listScramblers,
    validateScramble,
    invertAlg,
    simplifyFaceAlg,
    createSeededRng,
} from "../src/scramble/wca/index.js";

const out = document.getElementById("out");
const lines = [];
window.__M0_RESULTS__ = lines;

function eq(actual, expected, label) {
    if (actual !== expected) {
        throw new Error(`${label || "eq"}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
}

function truthy(value, label) {
    if (!value) throw new Error(`${label || "expected truthy"}`);
}

async function check(name, fn) {
    try {
        await fn();
        lines.push(`PASS ${name}`);
    } catch (error) {
        lines.push(`FAIL ${name}: ${error && error.message ? error.message : error}`);
    }
}

await check("registry: 17 official + 12 scramblers", () => {
    eq(listOfficialEvents().length, 17, "official");
    eq(listScramblers().length, 12, "scramblers");
});

await check("policy: 4x4 ready, FTO reserved", () => {
    eq(getScrambler("444").local, "ready", "444");
    eq(getScrambler("fto").local, "reserved", "fto");
    eq(getEvent("fto").availableFrom, "2027", "fto year");
    eq(getEvent("pyra").legacyEventId, "pyram", "pyra legacy id");
});

await check("rules: 4b3 minMoves", () => {
    eq(getEvent("222").minMoves, 4, "222");
    eq(getEvent("pyra").minMoves, 6, "pyra");
    eq(getEvent("skewb").minMoves, 7, "skewb");
    eq(getEvent("sq1").minMoves, 11, "sq1");
});

await check("notation: invert + simplify", () => {
    eq(invertAlg("R U R' U'", "333"), "U R U' R'", "333 invert");
    eq(invertAlg("(1,0) / (0,-3)", "sq1"), "(0,3) / (-1,0)", "sq1 invert");
    eq(simplifyFaceAlg("R R' U U U U"), "", "simplify");
});

await check("rules: square-1 slash", () => {
    eq(validateScramble("sq1", "(1,0) (0,-3)").ok, false, "missing slash");
    eq(validateScramble("sq1", "(1,0) / (0,-3)").ok, true, "with slash");
});

await check("rng: seeded determinism", () => {
    const a = createSeededRng(42);
    const b = createSeededRng(42);
    for (let i = 0; i < 10; i++) eq(a.nextUint32(), b.nextUint32(), `rng ${i}`);
});

await check("worker: capabilities", async () => {
    const service = new ScrambleService({ timeoutMs: 5000 });
    try {
        const caps = await service.getCapabilities();
        eq(caps.protocol, PROTOCOL_VERSION, "protocol");
        eq(caps.events.length, 17, "worker events");
        eq(caps.scramblers.find((s) => s.id === "444")?.local, "ready", "444");
        eq(caps.scramblers.find((s) => s.id === "fto")?.local, "reserved", "fto");
        truthy(caps.rulesVersion, "rulesVersion");
    } finally {
        service.dispose();
    }
});

await check("client: 4x4 local provider + init progress", async () => {
    const service = new ScrambleService({ timeoutMs: 30000 });
    try {
        const progress = [];
        const result = await service.generate("444", {
            onProgress: (data) => progress.push(data),
        });
        eq(result.source, "worker", "444 source");
        truthy(result.scrambles[0], "444 scramble");
        truthy(
            progress.some((item) => item.phase === "init" && item.percent === 100),
            "444 init progress"
        );
    } finally {
        service.dispose();
    }
});

await check("client: FTO is reserved", async () => {
    const service = new ScrambleService({ timeoutMs: 5000 });
    try {
        await service.generate("fto");
        throw new Error("expected EVENT_UNAVAILABLE");
    } catch (error) {
        eq(error.code, "EVENT_UNAVAILABLE", "fto code");
    } finally {
        service.dispose();
    }
});

const passed = lines.filter((line) => line.startsWith("PASS")).length;
const failed = lines.filter((line) => line.startsWith("FAIL")).length;

out.textContent = `${lines.join("\n")}\n\n${passed} passed, ${failed} failed`;
out.className = failed ? "fail" : "pass";
document.title = failed ? `FAIL (${failed})` : `PASS (${passed})`;
</script>
</body>
</html>
